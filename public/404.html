<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found · Sanskar Rai</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --bg: #f5f4f0;
        --text: #111;
        --muted: #5f5f5a;
        --line: #d9d7d0;
        --accent-text: #c9450f;
        color-scheme: light dark;
        font: 17px/1.5 system-ui, 'Segoe UI', Roboto, sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0b;
          --text: #f2f2f0;
          --muted: #9b9b9b;
          --line: #262629;
          --accent-text: #ff8a5b;
        }
      }
      body {
        margin: 0;
        min-height: 100svh;
        max-width: 1440px;
        margin-inline: auto;
        padding: 0 24px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 12px;
      }
      .label {
        font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
        font-size: 13px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        padding-bottom: 12px;
        border-bottom: 1px solid var(--line);
        margin: 0;
      }
      h1 {
        font-size: clamp(40px, 9vw, 128px);
        line-height: 0.9;
        letter-spacing: -0.04em;
        font-weight: 800;
        text-transform: uppercase;
        margin: 0;
      }
      p.note {
        color: var(--muted);
        max-width: 48ch;
        margin: 12px 0 0;
      }
      a {
        color: var(--accent-text);
      }
    </style>
  </head>
  <body>
    <p class="label">404 / NOT FOUND</p>
    <h1>Page not found</h1>
    <p class="note">
      SansySasy hasn't built this one yet. <a href="/">Back to the start</a>.
    </p>
  </body>
</html>
