    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Sanskar Rai",
        "alternateName": "SansySasy",
        "url": "https://sansysasy.com/",
        "jobTitle": "Software Engineer and Dynamics 365 Consultant",
        "worksFor": { "@type": "Organization", "name": "EBT" },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Delhi",
          "addressCountry": "IN"
        },
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "Jaypee University of Information Technology"
        },
        "sameAs": ["https://github.com/TheSansySasy"],
        "knowsAbout": [
          "Microsoft Dynamics 365 Finance and Operations",
          "X++",
          "Dynamics 365 Business Central integration",
          "Python",
          "FastAPI",
          "Microsoft Azure",
          "SQL Server Always On availability groups",
          "DevOps and CI/CD",
          "LLM document extraction"
        ],
        "hasCredential": {
          "@type": "EducationalOccupationalCredential",
          "name": "Microsoft Certified: Dynamics 365 Finance Functional Consultant Associate (MB-310)"
        }
      }
    </script>

    <script>
      // No-flash theme: apply the stored choice before first paint.
      // Mirrors applyTheme() in src/lib/theme.ts.
      ;(function () {
        try {
          var stored = localStorage.getItem('sr-theme')
          if (stored === 'dark' || stored === 'light') {
            document.documentElement.dataset.theme = stored
          }
        } catch (error) {
          /* blocked storage: fall back to the prefers-color-scheme rules */
        }
      })()
    </script>

  <body>

    <script type="module" src="/src/main.tsx"></script>
